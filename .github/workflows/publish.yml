name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build
        env:
          AE2OBJECTS_VERSION: ${{ github.event.release.tag_name }}

      - name: Upload Release Asset
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/ae2objects-${{ github.event.release.tag_name }}.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
