modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"

[[mods]]
modId = "ae2objects"
version = "${version}"
displayName = "AE2Objects"
${modIconKey} = "icon.png"
credits = "Based on AE2Things by ProjectET and Technici4n."
authors = "Likos-Lupus, Chiloven945"
description = '''
Adds Deep Storage Cells to Applied Energistics 2.
'''

[[mixins]]
config = "${mixinConfig}"

[[dependencies.ae2objects]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "ae2"
type = "required"
versionRange = "${ae2Range}"
ordering = "AFTER"
side = "BOTH"

# Optional MEGA Cells integration: reserved for the 1m-256m tiers (component source + conditional
# recipes). Registration and recipes stay disabled until a MEGA Cells 26.x build exists.
# No MEGA Java API is used.
[[dependencies.ae2objects]]
modId = "megacells"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Optional Applied Mekanistics (Mekanism chemicals) integration. Skeleton only: the chemical
# channel and recipes are deferred until an appmek 26.x build exists.
# TODO: register ChemicalChannelBinding + appmek:portable_chemical_cell, then enable chemical recipes.
[[dependencies.ae2objects]]
modId = "appmek"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "mekanism"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
