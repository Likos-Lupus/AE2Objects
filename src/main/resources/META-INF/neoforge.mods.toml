modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"

[[mods]]
modId = "ae2objects"
version = "${version}"
displayName = "AE2Objects"
logoFile = "icon.png"
credits = "Based on AE2Things by ProjectET and Technici4n."
authors = "Likos-Lupus, Chiloven945"
description = '''
Adds Deep Storage Cells to Applied Energistics 2.
'''

[[mixins]]
config = "ae2objects.mixins.json"

[[dependencies.ae2objects]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.71,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2, 26.2.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "ae2"
type = "required"
versionRange = "[26.1.10-beta, 26.2.0)"
ordering = "AFTER"
side = "BOTH"

# Optional MEGA Cells integration: only enables the 1m-256m recipes (component source + conditional
# recipes). No MEGA Java API is used.
# TODO: tighten the version range once a MEGA Cells 26.1 release exists.
[[dependencies.ae2objects]]
modId = "megacells"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Optional Applied Mekanistics (Mekanism chemicals) integration. Skeleton only: the chemical
# channel and recipes are deferred until an appmek 26.1 build exists.
# TODO: register ChemicalChannelBinding + appmek:portable_chemical_cell, then enable chemical recipes.
[[dependencies.ae2objects]]
modId = "appmek"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ae2objects]]
modId = "mekanism"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
